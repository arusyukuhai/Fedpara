# Linux only: TURN uses host networking to avoid incorrect relay addresses.
# Run with a real publicly reachable IPv4 address and a shared TURN_SECRET.
services:
  coturn:
    image: coturn/coturn:4.18.0
    network_mode: host
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-ec"]
    command: |
      exec turnserver -n \
        --listening-ip=0.0.0.0 \
        --listening-port=3478 \
        --realm="$${TURN_REALM}" \
        --external-ip="$${PUBLIC_IP}" \
        --use-auth-secret \
        --static-auth-secret="$${TURN_SECRET}" \
        --min-port=49160 --max-port=49200 \
        --fingerprint --no-cli --no-tls --no-dtls \
        --user-quota=20 --total-quota=200 \
        --no-multicast-peers --no-loopback-peers
    environment:
      TURN_REALM: ${TURN_REALM:?set TURN_REALM}
      PUBLIC_IP: ${PUBLIC_IP:?set PUBLIC_IP}
      TURN_SECRET: ${TURN_SECRET:?set TURN_SECRET}
