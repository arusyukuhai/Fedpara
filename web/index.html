<!DOCTYPE html>

<html lang="ja">
<head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>Mummy WebRTC test</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.10"></script></head><body class="min-h-screen bg-[#080e0b] text-[#e5f6ec] font-mono text-sm antialiased selection:bg-emerald-500 selection:text-[#080e0b] mx-auto max-w-[1100px] px-4 pb-16 pt-9 sm:px-7">
<h1 class="mb-5 border-b-2 border-emerald-500 pb-3 text-3xl font-extrabold tracking-tight text-emerald-300 sm:text-4xl">Mummy WebRTC デモ</h1>
<p class="hint my-3 leading-relaxed text-[#91a79b] my-3 text-xs leading-relaxed text-[#91a79b]">P2P: 同じルームを2つのタブで開きます。Native echo: -d:rtcNative でコンパイルしたサーバーにDataChannel接続します。</p>
<div class="grid grid-cols-1 gap-x-4 gap-y-2 sm:grid-cols-[9rem_minmax(0,1fr)] sm:items-center">
<label class="my-3 block text-xs font-bold text-emerald-50" for="mode">モード</label><select class="mt-1 min-w-0 w-full border border-emerald-900 bg-[#0c1912] px-3 py-2.5 text-sm text-emerald-50 placeholder:text-[#89a596] caret-emerald-400 focus:outline-2 focus:outline-offset-2 focus:outline-emerald-500 disabled:opacity-50" id="mode"><option value="p2p">2者P2P</option><option value="echo">Nimネイティブエコー</option></select>
<label class="my-3 block text-xs font-bold text-emerald-50" for="room">ルームID</label><input autocomplete="off" class="mt-1 min-w-0 w-full border border-emerald-900 bg-[#0c1912] px-3 py-2.5 text-sm text-emerald-50 placeholder:text-[#89a596] caret-emerald-400 focus:outline-2 focus:outline-offset-2 focus:outline-emerald-500 disabled:opacity-50" id="room" spellcheck="false"/>
<label class="my-3 block text-xs font-bold text-emerald-50" for="token">APP_TOKEN</label><input class="mt-1 min-w-0 w-full border border-emerald-900 bg-[#0c1912] px-3 py-2.5 text-sm text-emerald-50 placeholder:text-[#89a596] caret-emerald-400 focus:outline-2 focus:outline-offset-2 focus:outline-emerald-500 disabled:opacity-50" id="token" placeholder="未設定なら空欄" type="password"/>
<label class="my-3 block text-xs font-bold text-emerald-50" for="media">音声・映像</label><div><input class="mr-2 h-4 w-4 accent-emerald-500 align-middle" id="media" type="checkbox"/> P2P送受信 / nativeエコーはSRTP受信数を計測</div>
<label class="my-3 block text-xs font-bold text-emerald-50" for="relay">接続経路</label><div><input class="mr-2 h-4 w-4 accent-emerald-500 align-middle" id="relay" type="checkbox"/> TURN relayだけを利用（検証用）</div>
</div>
<p class="my-3 leading-relaxed text-[#91a79b]"><button class="inline-flex min-h-10 cursor-pointer items-center justify-center border border-emerald-500 bg-emerald-500 px-4 py-2 text-xs font-bold text-[#03170f] hover:bg-emerald-300 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-400 disabled:cursor-not-allowed disabled:opacity-50 mr-2 mt-2 mb-1" id="connect">接続</button> <button class="inline-flex min-h-10 cursor-pointer items-center justify-center border border-emerald-800 bg-[#0d1b13] px-4 py-2 text-xs font-bold text-emerald-100 hover:bg-emerald-900 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-400 disabled:cursor-not-allowed disabled:opacity-50 mr-2 mt-2 mb-1" disabled="" id="disconnect">切断</button></p>
<p class="my-3 leading-relaxed text-[#91a79b]">状態: <strong id="status">未接続</strong></p>
<div><video autoplay="" class="inline-block min-h-[120px] max-w-[48%] bg-black" id="local" muted="" playsinline=""></video> <video autoplay="" class="inline-block min-h-[120px] max-w-[48%] bg-black" id="remote" playsinline=""></video></div>
<p class="my-3 leading-relaxed text-[#91a79b]"><input class="mt-1 min-w-0 w-full border border-emerald-900 bg-[#0c1912] px-3 py-2.5 text-sm text-emerald-50 placeholder:text-[#89a596] caret-emerald-400 focus:outline-2 focus:outline-offset-2 focus:outline-emerald-500 disabled:opacity-50 w-3/4" disabled="" id="chat" placeholder="DataChannelのメッセージ"/> <button class="inline-flex min-h-10 cursor-pointer items-center justify-center border border-emerald-500 bg-emerald-500 px-4 py-2 text-xs font-bold text-[#03170f] hover:bg-emerald-300 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-400 disabled:cursor-not-allowed disabled:opacity-50 mr-2 mt-2 mb-1" disabled="" id="send">送信</button></p>
<pre class="max-h-[280px] min-h-[90px] overflow-auto whitespace-pre-wrap break-words border border-emerald-900 bg-[#020705] p-4 text-xs leading-relaxed text-emerald-100" id="log"></pre>
<script>
'use strict';
const $=id=>document.getElementById(id);
const log=s=>{ $('log').textContent += `${new Date().toLocaleTimeString()} ${s}\n`; $('log').scrollTop=$('log').scrollHeight; };
let ws=null, pc=null, channel=null, stream=null, remoteStream=null, pending=[], pendingLocal=[], haveRemote=false, offerSent=false, localSignalReady=false;
const roomId=()=>Array.from(crypto.getRandomValues(new Uint8Array(16)), n=>n.toString(16).padStart(2,'0')).join('');
$('room').value=(location.hash.slice(1).match(/^[A-Za-z0-9_-]{16,64}$/)||[])[0]||roomId();
const sendSignal=data=>{if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify(data));};
const status=s=>$('status').textContent=s;
function setupChannel(ch){
  channel=ch;
  channel.onopen=()=>{log('DataChannel opened'); $('chat').disabled=false; $('send').disabled=false;};
  channel.onclose=()=>{log('DataChannel closed'); $('chat').disabled=true; $('send').disabled=true;};
  channel.onerror=e=>log('DataChannel error: '+(e.message||'unknown'));
  channel.onmessage=e=>log('受信: '+String(e.data));
}
function closePeer(){
  if(channel){channel.close();channel=null;}
  if(pc){pc.close();pc=null;}
  pending=[];pendingLocal=[];haveRemote=false;offerSent=false;localSignalReady=false;
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  $('local').srcObject=null;$('remote').srcObject=null;
  $('chat').disabled=true;$('send').disabled=true;
}
function disconnect(){
  if(ws){const old=ws;ws=null;try{old.close();}catch{}}
  closePeer();status('未接続');$('connect').disabled=false;$('disconnect').disabled=true;
}
async function preparePc(iceServers){
  pc=new RTCPeerConnection({iceServers,iceTransportPolicy:$('relay').checked?'relay':'all'});
  pc.onicecandidate=e=>{
    // Explicitly send end-of-candidates as null too.
    const m={type:'candidate',candidate:e.candidate?e.candidate.toJSON():null};
    if(localSignalReady)sendSignal(m);else pendingLocal.push(m);
  };
  pc.onconnectionstatechange=()=>{if(pc){status(pc.connectionState);log('PeerConnection: '+pc.connectionState);}};
  pc.oniceconnectionstatechange=()=>{if(pc)log('ICE: '+pc.iceConnectionState);};
  pc.ondatachannel=e=>setupChannel(e.channel);
  pc.ontrack=e=>{
    if(!remoteStream){remoteStream=new MediaStream();$('remote').srcObject=remoteStream;}
    remoteStream.addTrack(e.track);
  };
  if(stream)for(const track of stream.getTracks())pc.addTrack(track,stream);
}
async function setRemote(sdp,type){
  await pc.setRemoteDescription({type,sdp});haveRemote=true;
  for(const c of pending)await pc.addIceCandidate(c);
  pending=[];
}
function publishLocalCandidates(){
  localSignalReady=true;
  for(const m of pendingLocal)sendSignal(m);
  pendingLocal=[];
}
async function offer(){
  if(!pc || offerSent)return;
  offerSent=true;
  const o=await pc.createOffer();
  await pc.setLocalDescription(o);
  sendSignal({type:'offer',sdp:pc.localDescription.sdp});
  publishLocalCandidates();
  log('SDP offer sent');
}
async function handleMessage(event){
  let m;try{m=JSON.parse(event.data);}catch{log('Bad server JSON');return;}
  try{
    switch(m.type){
      case 'joined':
        log('Joined: '+m.role);
        await preparePc(m.iceServers);
        if(m.role==='initiator'||m.role==='native-client'){
          setupChannel(pc.createDataChannel('chat'));
          if(m.role==='native-client')await offer();
        }break;
      case 'peer-joined': await offer();break;
      case 'offer':
        await setRemote(m.sdp,'offer');
        await pc.setLocalDescription(await pc.createAnswer());
        sendSignal({type:'answer',sdp:pc.localDescription.sdp});
        publishLocalCandidates();
        log('SDP answer sent');break;
      case 'answer':await setRemote(m.sdp,'answer');log('SDP answer received');break;
      case 'candidate':
        if(!pc)return;
        if(!haveRemote)pending.push(m.candidate);
        else await pc.addIceCandidate(m.candidate);
        break;
      case 'peer-left':log('相手が切断しました。再接続してください');disconnect();break;
      case 'state':log('Native state: '+m.state);break;
      case 'rtp-stats':log('Native SRTP → RTP packets received: '+m.receivedPackets);break;
      case 'error':log('Server error: '+m.message);break;
      default:log(JSON.stringify(m));
    }
  }catch(e){log('WebRTC error: '+e.message);console.error(e);}
}
$('connect').onclick=async()=>{
  $('connect').disabled=true;$('disconnect').disabled=false;
  try{
    const mode=$('mode').value;
    if($('media').checked){
      stream=await navigator.mediaDevices.getUserMedia({audio:true,video:true});
      $('local').srcObject=stream;
    }
    if(mode==='p2p')location.hash=$('room').value;
    ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
    ws.onopen=()=>{status('シグナリング接続');sendSignal({type:'join',mode,room:$('room').value,token:$('token').value});};
    ws.onmessage=e=>{void handleMessage(e);};
    ws.onerror=()=>log('WebSocket transport error');
    ws.onclose=()=>{log('Signaling closed');disconnect();};
  }catch(e){log('接続失敗: '+e.message);disconnect();}
};
$('disconnect').onclick=disconnect;
$('send').onclick=()=>{if(channel?.readyState==='open'){
 const message=$('chat').value;channel.send(message);log('送信: '+message);$('chat').value='';
}};
$('chat').onkeydown=e=>{if(e.key==='Enter')$('send').click();};
</script></body></html>
