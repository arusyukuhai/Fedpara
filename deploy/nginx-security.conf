# Large rooms may share one NAT IP. Tune these admission limits and enforce upstream WAF/DDoS policy.
# Nginx includes: top-level http { ... }. Adjust certificate and domain.
# Defense in depth. This is NOT sufficient against volumetric/L3 DDoS.
limit_req_zone $binary_remote_addr zone=fp_ws_req:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=fp_ws_conn:10m;
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
upstream fp_mummy { server 127.0.0.1:8080; keepalive 64; }
server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN;
    ssl_certificate /etc/ssl/example/fullchain.pem;
    ssl_certificate_key /etc/ssl/example/privkey.pem;
    client_max_body_size 8k;
    location /ws {
        limit_conn fp_ws_conn 1024;
        limit_req zone=fp_ws_req burst=200 nodelay;
        proxy_pass http://fp_mummy;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_buffering off;
    }
    location / { limit_req zone=fp_ws_req burst=100 nodelay; proxy_pass http://fp_mummy; }
}
